services:
  postgres:
    image: postgres:17-alpine
    container_name: sollu-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sollu_core
      POSTGRES_USER: whykrr
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - sollu-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whykrr -d sollu_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sollu-dev-network

  redis:
    image: redis:7-alpine
    container_name: sollu-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - sollu-redis-data:/data
    networks:
      - sollu-dev-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: sollu-mailpit-dev
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - sollu-dev-network

volumes:
  sollu-pg-data:
    driver: local
  sollu-redis-data:
    driver: local

networks:
  sollu-dev-network:
    driver: bridge
