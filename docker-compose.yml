version: "3.8"

services:
    mailpit:
        image: axllent/mailpit:latest
        container_name: sollu_mailpit
        ports:
            - "8025:8025" # Web UI
            - "1025:1025" # SMTP port
        restart: unless-stopped

    redis:
        image: redis:7
        container_name: sollu_redis
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        restart: unless-stopped

volumes:
    redis-data:
