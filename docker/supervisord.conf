[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=5
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=10
stopsignal=QUIT
stopwaitsecs=10
stopasgroup=true
killasgroup=true

[program:horizon]
command=php artisan horizon
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=15
stopsignal=SIGTERM
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/html/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/storage/logs/horizon-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:reverb]
command=php artisan reverb:start --host="0.0.0.0" --port=8080 --no-interaction
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stopsignal=SIGTERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/html/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/html/storage/logs/reverb-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:cron]
command=crond -f -l 2
autostart=true
autorestart=true
priority=25
stopsignal=SIGTERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

